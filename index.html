<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shrestha Services — Printing & Signage in Biratnagar</title>
    <meta
      name="description"
      content="A Biratnagar print and signage workshop. Large-format flex, LED acrylic sign boards, vehicle wraps and digital print — proofed, produced and installed in-house."
    />
    <meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14120f" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Shrestha Services — Printing & Signage in Biratnagar" />
    <meta
      property="og:description"
      content="Large-format flex, LED acrylic sign boards, vehicle wraps and digital print — proofed, produced and installed in-house."
    />
    <meta property="og:site_name" content="Shrestha Services" />

    <!-- Fonts: Fraunces (display serif) + Inter (UI/body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      try {
        const localSettings = localStorage.getItem("ss_settings");
        if (localSettings) {
          const parsed = JSON.parse(localSettings);
          if (parsed.darkMode) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
